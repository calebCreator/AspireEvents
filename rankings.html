<!DOCTYPE html>

<html>
    <head>
        <title>Aspire Scoring</title>
        <link rel="stylesheet" type="text/css" href="style.css">
        <link rel="icon" type="image/png" href="https://codehs.com/uploads/ca70a451e53c1733dce494f0b2d7cefe">
        <style>
            @keyframes spin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }
            .spinner-inline {
                display: inline-block;
                width: 20px;
                height: 20px;
                border: 3px solid rgba(0, 0, 0, 0.15);
                border-top: 3px solid var(--primary, #2735d0);
                border-radius: 50%;
                animation: spin 1s linear infinite;
                margin-right: 8px;
                vertical-align: middle;
            }
        </style>
        <script src="main.js"></script>
        <script src="rankings.js"></script>
    </head>
    
    <body onload="displayRankings(); setInterval(displayRankings, 5000);">
        
    
        <div class="navbar"> 
            <a href="index.html"><img id="logo" src="https://codehs.com/uploads/ca70a451e53c1733dce494f0b2d7cefe"></a>
            <a class="link" href="quals.html">Qualification Matches</a>
            <a class="link" href="finals.html">Finals</a>
            <a class="link" href="rankings.html">Rankings</a>
            
        </div>
        <h1 id="test">Event Rankings</h1>
        <table id= "rankings" border="2px">
            
            <tr class="zebra">
                <th>Rank</th>
                <th>Team #</th>
                <th>RP</th>
                <th>Match Points</th>
                <th>Plays</th>
            </tr>
            

            
        </table>
        
        <h4 id="msg">Loading...</h4>
        
    </body>
</html>
