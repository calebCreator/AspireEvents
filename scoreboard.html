<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scoreboard</title>
    <script src="main.js"></script>
    <link rel="icon" type="image/png" href="https://codehs.com/uploads/ca70a451e53c1733dce494f0b2d7cefe">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        .scoreboard {
            display: flex;
            gap: 0px;
            justify-content: center;
            align-items: center;
        }
        
        .team {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        
        .team-name {
            font-size: 48px;
            font-weight: bold;
            color: white;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .red .team-name {
            color: #ff4444;
        }
        
        .blue .team-name {
            color: #4488ff;
        }
        
        .score {
            font-size: 200px;
            font-weight: bold;
            line-height: 1;
            min-width: 250px;
            text-align: center;
        }
        
        .red .score {
            color: #ff4444;
        }
        
        .blue .score {
            color: #4488ff;
        }

        .side-teams {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 16px;
        }

        .side-team {
            font-size: 48px;
            font-weight: bold;
        }
        .match-id {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 64px;
            font-weight: bold;
            color: white;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="scoreboard">
        <div class="side-teams red-teams">
            <span class="side-team" style="color:#ff4444;" id="red1">—</span>
            <span class="side-team" style="color:#ff4444;" id="red2">—</span>
        </div>
        <div class="team red">
            <div class="team-name">Red</div>
            <div class="score" id="redScore">0</div>
        </div>
        <div class="match-id">
            <span id="matchId">Q1</span>
        </div>
        <div class="team blue">
            <div class="team-name">Blue</div>
            <div class="score" id="blueScore">0</div>
        </div>
        <div class="side-teams blue-teams">
            <span class="side-team" style="color:#4488ff;" id="blue1">—</span>
            <span class="side-team" style="color:#4488ff;" id="blue2">—</span>
        </div>
    </div>

    <script>
        // Expiry: 12 hours of inactivity
        const EXPIRY_MS = 12 * 60 * 60 * 1000;
        const LAST_ACTIVE_KEY = 'lastActiveTime';

        function refreshActivity() {
        localStorage.setItem(LAST_ACTIVE_KEY, Date.now().toString());
        }

        function checkExpiry() {
            const last = parseInt(localStorage.getItem(LAST_ACTIVE_KEY) || '0', 10);
            if (last && Date.now() - last > EXPIRY_MS) {
                expirePage();
            } else {
                refreshActivity();
            }
        }

        function expirePage() {
            document.body.innerHTML = `
                <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;text-align:center;">
                <h1>Session Expired</h1>
                <p>This page has been inactive for more than 12 hours.</p>
                <button onclick="location.reload()" style="padding:10px 20px;font-size:1em;cursor:pointer;">Reload</button>
                </div>`;
            localStorage.removeItem(LAST_ACTIVE_KEY);
            localStorage.removeItem('pastMatches');
            localStorage.removeItem('refereeColor');
        }

        // Check on load
        //checkExpiry();
        refreshActivity();

        // Reset timer on any user interaction
        ['click', 'keydown', 'touchstart', 'mousemove'].forEach(evt =>
        document.addEventListener(evt, refreshActivity, { passive: true })
        );

        // Also check periodically (every 5 minutes) in case the tab is left open
        setInterval(checkExpiry, 5 * 60 * 1000);

        async function updateScores() {
            var scores = await getScoreboardData();
            document.getElementById('redScore').textContent = scores['red'] || 0;
            document.getElementById('blueScore').textContent = scores['blue'] || 0;
        }

        async function updateTeams() {
            var curMatch = await getCurrentMatch();
            if (curMatch) {
                document.getElementById('red1').textContent = curMatch[2];
                document.getElementById('red2').textContent = curMatch[3];
                document.getElementById('blue1').textContent = curMatch[4];
                document.getElementById('blue2').textContent = curMatch[5];
                document.getElementById('matchId').textContent = curMatch[0];
            }
        }

        // Update scores on page load
        updateScores();
        updateTeams();
        //Reset both scores to 0 on load to prevent stale data
        sendScoreboardData('red', '0');
        sendScoreboardData('blue', '0');

        // Listen for storage changes (updates from other tabs/windows)
        window.addEventListener('storage', updateScores);

        // Poll for changes every 3 seconds as backup
        setInterval(updateScores, 3000);

        setInterval(updateTeams, 10000); // Update team names every 10 seconds
    </script>
</body>
</html>
