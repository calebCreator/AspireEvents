<!DOCTYPE html>

<html>
    <head>
        <title>Aspire Scoring</title>
        <link rel="stylesheet" type="text/css" href="style.css">
        <link rel="icon" type="image/png" href="https://codehs.com/uploads/2b3fa3735a88401d11a7fefe3bb0b3ff">
    </head>
    
    <body onload="displayQualMatches(); setInterval(displayQualMatches, 5000);">
        <script src="main.js"></script>
        <div class="navbar"> 
            <a href="index.html"><img id="logo" src="https://codehs.com/uploads/2b3fa3735a88401d11a7fefe3bb0b3ff"></a>
            <a class="link" href="quals.html">Qualification Matches</a>
            <a class="link" href="finals.html">Finals</a>
            <a class="link" href="rankings.html">Rankings</a>
            <a class="link" href="stream.html">Stream</a>
        </div>
        <h1>Qualification Matches</h1>
        <table id="qualificationMatches" border="2px">
            <colgroup>
                <col span="1">
                <col span="1" style="background-color:pink">
                <col span="1" style="background-color:lightblue">
                <col span="1" style="background-color:pink">
                <col span="1" style="background-color:lightblue">
            </colgroup>
            <tr>
                <th>Match #</th>
                <th class="red">Red 1</th>
                <th class="red">Red 2</th>
                <th class="blue">Blue 1</th>
                <th class="blue">Blue 2</th>
                <th class="red">Red Score</th>
                <th class="blue">Blue Score</th>
                <th>Winner</th>
            </tr>
            
        </table>
        
        <h4 id="msg">Loading...</h4>
    </body>
</html>
